; Step 1: MPU6050 (GY-521) bring-up on ESP32-S3-DevKitC-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; USB cable is on the "UART" port, so Serial must go to UART0, not native USB CDC
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
