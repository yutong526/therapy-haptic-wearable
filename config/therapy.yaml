# Protocol for actual use in a therapy session (run_session.py --protocol config/therapy.yaml).
# The baseline comes from the opening small talk, computed the same way as in data collection
# (code 1 = chat, BASELINE_SOURCE in settings.py). The steps start by themselves (auto_steps):
# chat after the settling time, therapy after the chat. Also the default for run_session.py
# --pump auto / off (demo, tests).
# Not a data collection: no self-report.

settling_minutes: 3            # electrodes settle while getting ready
auto_steps: true               # chat and therapy start by themselves when the time is up

conditions:
  "1": {name: chat,    color: "#90CAF9"}
  "5": {name: therapy, color: "#FFCDD2"}  # light red: not purple / green / orange (pump banners)

orders:
  therapy:
    - {code: "1", minutes: 3, note: "opening small talk (neutral topics); sensor hand still"}
    - {code: "5", minutes: 50, note: "therapy"}
